<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090c10" />
    <title>Reconnect · Text Adventures</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #090c10;
        --panel-bg: #111820;
        --panel-line: #2e5560;
        --text: #d8f4e8;
        --text-muted: #8eb5ac;
        --accent: #7be88f;
        --gold: #f3cc66;
        font: 16px/1.5 system-ui, sans-serif;
        color: var(--text);
        background: var(--page-bg);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid var(--panel-line); border-radius: 8px; background: var(--panel-bg); }
      .brand { margin: 0 0 24px; color: var(--gold); font-family: monospace; font-weight: 700; }
      h1 { font-size: 24px; line-height: 1.25; margin: 0 0 16px; }
      p { color: var(--text-muted); margin: 0 0 24px; }
      button { min-height: 48px; width: 100%; padding: 12px 16px; border: 0; border-radius: 6px; font: inherit; font-weight: 700; color: var(--page-bg); background: var(--accent); cursor: pointer; touch-action: manipulation; }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">TEXT ADVENTURES</p>
      <h1>Reconnect to continue</h1>
      <p>The game needs an internet connection. Check your connection, then try again to return to your adventure.</p>
      <form method="get"><button type="submit">Try again</button></form>
    </main>
  </body>
</html>
